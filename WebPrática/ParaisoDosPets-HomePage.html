<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paraíso dos Pets</title>

    <style>

        main {
            padding-top: 70px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8f4df;
            color: #573925;
        }

        a {
            text-decoration: none;
            color: inherit;
        }


        header {
            width: 100%;
            height: 70px;

            background-color: #faf8e9;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;

            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.15);

            position: fixed;
            z-index: 10;
        }


        .logo {
            width: 120px;
            height: 55px;

            display: flex;
            align-items: center;
        }

        .logo img {
            max-width: 110px;
            max-height: 50px;

            object-fit: contain;
        }


        header nav {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        header nav a {
            font-size: 13px;
            color: #59402f;

            transition: 0.2s;
        }

        header nav a:hover {
            color: #397967;
        }


        #carrinhoLogo {
            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #carrinhoLogo img {
            width: 23px;
            height: 23px;

            object-fit: contain;
        }

        #Perfil {
            width: 35px;
            height: 35px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: #d5d8a8;

            border: 2px solid #a8a87a;

            overflow: hidden;
        }

        #Perfil img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }



        .Inicio {
        width: 100%;
        height: 520px;
        padding-bottom: 10px;
        background-image: url("img/backgroundParaiso.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;

        align-items: center;
        justify-content: center;
        text-align: center;

        position: relative;

        overflow: hidden;
        }


        .Inicio h2 {
            position: relative;

            z-index: 2;
            padding-bottom: 200px;
            width: 350px;

            font-size: 25px;

            line-height: 1.4;

            font-weight: 400;

            color: #5c3d28;

            text-align: center;
        }


        .prodOferecidos {
            width: 100%;

            min-height: 360px;

            padding: 20px 40px 45px;

            background-color: #f8f4df;

            text-align: center;
        }


        .prodOferecidos h3 {
            display: inline-block;

            min-width: 310px;

            padding: 8px 35px;

            margin-bottom: 5px;

            background-color: rgba(255, 255, 255, 0.55);

            color: #5a3d29;

            font-size: 20px;

            font-weight: 400;

            box-shadow: 0 3px 7px rgba(0, 0, 0, 0.08);
        }


        .prodOferecidos h6 {
            font-size: 11px;

            font-weight: 400;

            color: #755c49;

            margin-bottom: 35px;
        }

        .prodOferecidos nav {
            width: 100%;

            max-width: 900px;

            margin: auto;

            display: grid;

            grid-template-columns: repeat(6, 1fr);

            align-items: center;

            gap: 25px;
        }


        #prodCanino {
            grid-column: 2 / 3;
        }

        #prodFelini {
            grid-column: 4 / 5;
        }

        #Medicamentos {
            grid-column: 1 / 3;
        }

        #Brinquedos {
            grid-column: 3 / 5;
        }

        #Alimentação {
            grid-column: 5 / 7;
        }



        .prodOferecidos nav a {
            width: 180px;
            height: 190px;
            justify-self: center;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: 0.25s;
        }



        .prodOferecidos nav a img {
            width: 100%;

            height: 100%;

            object-fit:cover;

            display: block;
        }



        .prodOferecidos nav a:hover {
            transform: translateY(-5px);

            box-shadow:
                0 7px 12px rgba(0, 0, 0, 0.20);
        }


        footer {
            width: 100%;

            min-height: 200px;

            background-color: #624835;

            color: #fff9e8;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 120px;

            padding: 35px 60px;

            position: relative;
        }



        footer::before {
            content: "";

            position: absolute;

            top: 25px;

            left: 11%;

            right: 11%;

            height: 1px;

            background-color: rgba(255, 255, 255, 0.7);
        }




        footer > img {
            width: 130px;

            max-height: 100px;

            object-fit: contain;
        }


   

        footer nav {
            display: grid;

            grid-template-columns: 120px 150px;

            column-gap: 25px;

            row-gap: 12px;
        }


        footer nav a {
            font-size: 12px;

            color: #fff9e8;

            transition: 0.2s;
        }


        footer nav a:hover {
            color: #d8d99f;
        }
        #tituloHero {
            width: 300px;
            height: auto;
            margin-top: 20px;
        }

        @media (max-width: 700px) {

            header {
                height: 60px;

                padding: 0 12px;
            }

            .logo {
                width: 90px;
            }

            .logo img {
                max-width: 85px;
            }

            header nav {
                gap: 12px;
            }

            header nav a {
                font-size: 10px;
            }

            #carrinhoLogo,
            #Perfil {
                display: none;
            }

            
            .Inicio {
                min-height: 320px;
            }

            .Inicio h2 {
                width: 280px;

                font-size: 20px;

                margin-top: 40px;
            }


            .prodOferecidos {
                padding: 20px 15px 40px;
            }

            .prodOferecidos nav {
                grid-template-columns: repeat(2, 1fr);

                gap: 25px 10px;
            }

            #prodCanino,
            #prodFelini,
            #Medicamentos,
            #Brinquedos,
            #Alimentação {
                grid-column: auto;
            }

            .prodOferecidos nav a {
                width: 135px;

                height: 95px;
            }


            footer {
                flex-direction: column;

                gap: 30px;

                padding: 45px 20px;
            }

            footer nav {
                grid-template-columns: 120px 140px;
            }

            footer::before {
                left: 10%;
                right: 10%;
            }
        }

    </style>
</head>

<body>

    <header>

        <div class="logo">
            <img src="img/iconeSite.png">
        </div>

        <nav>

            <a href="#">Serviços</a>

            <a href="#">Produtos</a>

            <a href="#">Sobre nós</a>

            <a href="#" id="carrinhoLogo">
                <img src="img/carrinho.png">
            </a>

            <a href="#" id="Perfil">
                <img src="img/icone perfil.png">
            </a>

        </nav>

    </header>


    <main>

        <section class="Inicio">

            <img src="img/TituloSite.png" id="tituloHero">

            <h2>
                Produtos, serviços e muito carinho
                para o seu melhor amigo.
            </h2>

        </section>


        <section class="prodOferecidos">

            <h3>
                Serviços e Produtos oferecidos
            </h3>

            <h6>
                Tudo para o seu amiguinho de 4 patas... de 2... ou asas!
            </h6>


            <nav>

                <a href="#" id="prodCanino">
                    <img src="img/ProdutosCanisLupos.png">
                </a>

                <a href="#" id="prodFelini">
                    <img src="img/ProdutosFelis.png">
                </a>

                <a href="#" id="Medicamentos">
                    <img src="img/medicamentosProdutos.png">
                </a>

                <a href="#" id="Brinquedos">
                    <img src="img/BrinqProdutos.png">
                </a>

                <a href="#" id="Alimentação">
                    <img src="img/ProdutosAliment.png">
                </a>

            </nav>

        </section>

    </main>


    <footer>

        <img src="img/logoFooter.png">

        <nav>

            <a href="#" id="SobreFt">
                Sobre nós
            </a>

            <a href="#" id="AjudaFt">
                Ajuda
            </a>

            <a href="#" id="EntregaFt">
                Entrega
            </a>

            <a href="#" id="FaleConoscoFt">
                Fale conosco
            </a>

            <a href="#" id="TrabConoscoFt">
                Trabalhe conosco
            </a>

            <a href="#" id="PolitPrivacidadeFt">
                Política de privacidade
            </a>

        </nav>

    </footer>

</body>
</html>
