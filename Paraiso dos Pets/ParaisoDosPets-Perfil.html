<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

           * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8f4df;
            color: #573925;
        }

        a {
            text-decoration: none;
            color: inherit;
        }



        header {
    width: 100%;
    height: 70px;

    background-color: #faf8e9;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    box-shadow: 0 2px 7px rgba(0, 0, 0, 0.15);

    position: fixed;
    z-index: 10;
}

.logo {
    width: 120px;
    height: 55px;

    display: flex;
    align-items: center;
}

.logo img {
    max-width: 110px;
    max-height: 50px;

    object-fit: contain;
}

header nav {
    display: flex;
    align-items: center;
    gap: 35px;
}

header nav a {
    font-size: 13px;
    color: #59402f;

    transition: 0.2s;
}

header nav a:hover {
    color: #397967;
}

#carrinhoLogo {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;
}

#carrinhoLogo img {
    width: 23px;
    height: 23px;

    object-fit: contain;
}

#Perfil {
    width: 35px;
    height: 35px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background-color: #d5d8a8;

    border: 2px solid #a8a87a;

    overflow: hidden;
}

#Perfil img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

footer {
    width: 100%;

    min-height: 200px;

    background-color: #624835;

    color: #fff9e8;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 120px;

    padding: 35px 60px;

    position: relative;
}

footer::before {
    content: "";

    position: absolute;

    top: 25px;

    left: 11%;

    right: 11%;

    height: 1px;

    background-color: rgba(255, 255, 255, 0.7);
}

footer > img {
    width: 130px;

    max-height: 100px;

    object-fit: contain;
}

footer nav {
    display: grid;

    grid-template-columns: 120px 150px;

    column-gap: 25px;

    row-gap: 12px;
}

footer nav a {
    font-size: 12px;

    color: #fff9e8;

    transition: 0.2s;
}

footer nav a:hover {
    color: #d8d99f;
}

main {
    padding-top: 70px;
}

.perfilPagina {
    width: 100%;
    min-height: 440px;
    background-image:
        linear-gradient(
            rgba(248, 244, 223, 0.65),
            rgba(248, 244, 223, 0.65)
        ),
        url("img/backgroundPatas.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 75px 7% 50px;
}

.tituloPerfil {
    font-size: 18px;
    font-weight: 400;
    color: #573925;
    margin-bottom: 30px;
}

.introducaoPerfil {
    width: 100%;
    display: flex;
    align-items: center;
    margin-bottom: 35px;
}

.fotoPerfil {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 20px;
}

.dadosPerfil {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.dadosPerfil h4 {
    font-size: 15px;
    font-weight: 500;
    color: #573925;
}

.dadosPerfil small {
    font-size: 11px;
    color: #806f62;
}

.introducaoPerfil button {
    margin-left: auto;
    width: 65px;
    height: 32px;
    border: none;
    border-radius: 5px;
    background-color: #624835;
    color: #fff9e8;
    font-size: 11px;
    cursor: pointer;
}

.introducaoPerfil button:hover {
    background-color: #397967;
}

.caixasDeDados {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 40px;
    row-gap: 20px;
}

.campo {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.campo label {
    font-size: 11px;
    color: #735944;
}

.campo input,
.campo select {
    width: 100%;
    height: 34px;
    border: none;
    border-radius: 5px;
    background-color: #fff;
    padding: 0 12px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    color: #8a8a8a;
    outline: none;
}

.campo select {
    cursor: pointer;
}

.animaisCadastrados {
    width: 100%;
    height: 55px;
    background-color: #806650;
    border-radius: 5px;
    display: flex;
    align-items: center;
    padding: 5px;
    color: #fff9e8;
}

.animalFoto {
    width: 45px;
    height: 45px;
    border-radius: 3px;
    object-fit: cover;
    margin-right: 10px;
}

.animalDados {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 10px;
}

.animalDados p {
    margin: 0;
}

.animalDados strong {
    font-weight: bold;
}
    </style>
</head>
<body>
    <header>

        <div class="logo">
            <a href="ParaisoDosPets-HomePage.html"><img src="img/iconeSite.png"></a>
        </div>

        <nav>

            <a href="paraisoDosPets - Servicos.html">Serviços</a>

            <a href="ParaisoDosPets-Produtos.html">Produtos</a>

            <a href="ParaisoDosPets-SobreNos.html">Sobre nós</a>

            <a href="ParaisoDosPets-Carrinho.html" id="carrinhoLogo">
                <img src="img/carrinho.png">
            </a>

            <a href="ParaisoDosPets-Perfil.html" id="Perfil">
                <img src="img/icone perfil.png">
            </a>

        </nav>

    </header>
    <main>

    <section class="perfilPagina">

        <h2 class="tituloPerfil">Perfil</h2>

        <div class="introducaoPerfil">

            <img class="fotoPerfil" src="img/iconeperifl.png" alt="fotoPerfil">

            <div class="dadosPerfil">
                <h4>Alexa Rowles</h4>
                <small>alexarawles@gmail.com</small>
            </div>

            <button>Editar</button>

        </div>

        <section class="caixasDeDados">

            <div class="campo">
                <label>Nome completo</label>
                <input type="text" value="Alexa Rowles dos Santos">
            </div>

            <div class="campo">
                <label>Apelido</label>
                <input type="text" value="Alex">
            </div>

            <div class="campo">
                <label>Gênero</label>
                <select>
                    <option>Feminina</option>
                    <option>Masculino</option>
                    <option>Outro</option>
                </select>
            </div>

            <div class="campo">
                <label>Animais cadastrados</label>

                <div class="animaisCadastrados">

                    <img class="animalFoto" src="img/betofoto.png" alt="Beto">

                    <div class="animalDados">
                        <p>Nome: <strong>Beto Rowles</strong>&nbsp;&nbsp;&nbsp;&nbsp; Idade: <strong>4 meses</strong></p>
                        <p>Raça: <strong>Pincher</strong></p>
                    </div>

                </div>

            </div>

        </section>

    </section>

</main>
    <footer>

        <img src="img/logoFooter.png">

        <nav>

            <a href="#" id="SobreFt">
                Sobre nós
            </a>

            <a href="#" id="AjudaFt">
                Ajuda
            </a>

            <a href="#" id="EntregaFt">
                Entrega
            </a>

            <a href="#" id="FaleConoscoFt">
                Fale conosco
            </a>

            <a href="#" id="TrabConoscoFt">
                Trabalhe conosco
            </a>

            <a href="#" id="PolitPrivacidadeFt">
                Política de privacidade
            </a>

        </nav>

    </footer>
</body>
</html>
